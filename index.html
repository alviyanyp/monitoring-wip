<title>Monitoring WIP</title>
<style>
  :root{--green:#22a447;--green-dd:#0f5a2c;--ink:#1c2b22;--ink-2:#5b6b61;--bg:#eef3ef}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink)}
  .box{background:#fff;border-top:5px solid var(--green);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.08);padding:28px 30px;width:min(420px,calc(100vw - 32px));text-align:center}
  h1{margin:0 0 4px;font-size:20px;color:var(--green-dd);letter-spacing:.3px}
  p{margin:6px 0;color:var(--ink-2);font-size:14px;line-height:1.5}
  .spin{width:38px;height:38px;margin:18px auto 6px;border-radius:50%;border:4px solid #d7e9dc;border-top-color:var(--green);animation:r .9s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .err{color:#b31919;font-weight:700}
  button{margin-top:14px;border:0;border-radius:8px;background:var(--green-dd);color:#fff;font-weight:800;padding:10px 18px;font-size:14px;cursor:pointer}
</style>
</head>
<body>
<div class="box" id="box">
  <h1>DAILY WIP · MONITORING</h1>
  <p>Memuat dashboard versi terbaru…</p>
  <div class="spin" id="spin"></div>
  <p id="msg"></p>
</div>
<script>
/* Peluncur dashboard: file ini cukup diunduh sekali. Isi dashboard selalu diambil versi terbaru dari server. */
(function(){
  var APP_URL="https://script.google.com/macros/s/AKfycbxe5oGgxDP8dT75pBSqS49h1X-UHWpTMW8WOd-fGDOKiIhHPocwqlmW7YChyGQ2ImGmnQ/exec";
  var KEY="wipAppCache", KEYV="wipAppVer";
  function show(html,v,offline){
    window.WIP_APP_URL=APP_URL; window.WIP_APP_V=v||""; window.WIP_OFFLINE=!!offline;
    document.open(); document.write(html); document.close();
  }
  function fail(why){
    var c=null,v=""; try{ c=localStorage.getItem(KEY); v=localStorage.getItem(KEYV)||""; }catch(e){}
    if(c){ show(c,v,true); return; }
    document.getElementById("spin").style.display="none";
    document.getElementById("msg").innerHTML='<span class="err">Dashboard belum bisa dimuat.</span><br>'+why+'<br><button type="button" onclick="location.reload()">Coba lagi</button>';
  }
  var shown=false, msg=document.getElementById("msg");
  var slow=setTimeout(function(){ if(!shown) msg.textContent="Server sedang disiapkan, mohon tunggu sebentar…"; },8000);
  var giveUp=setTimeout(function(){ if(!shown) fail("Server terlalu lama merespons (lebih dari 60 detik)."); },60000);
  function done(){ shown=true; clearTimeout(slow); clearTimeout(giveUp); }
  fetch(APP_URL+"?action=app&_="+Date.now()).then(function(r){return r.text()}).then(function(t){
    var j=null; try{ j=JSON.parse(t); }catch(e){}
    if(!j){ if(!shown){ done(); fail("Server belum memakai versi Apps Script terbaru. Lakukan Deploy &gt; Kelola deployment &gt; Versi baru."); } return; }
    if(!j.ok||!j.html){ if(!shown){ done(); fail(j.error==="app_not_set"?"File dashboard belum dipasang di server (APP_FILE_ID kosong).":j.error==="file_not_found"?"File dashboard di Google Drive tidak ditemukan.":"Server mengembalikan error: "+(j.error||"-")); } return; }
    try{ localStorage.setItem(KEY,j.html); localStorage.setItem(KEYV,j.v); }catch(e){}
    done(); show(j.html,j.v,false);   /* tetap ditampilkan walau datang terlambat */
  }).catch(function(){ if(shown) return; done(); fail("Tidak bisa menghubungi server. Periksa internet Anda."); });
})();
</script>
</body>
</html>
